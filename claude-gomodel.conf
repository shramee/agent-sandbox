# claude-gomodel model overrides
# Sourced by claude-gomodel (sh syntax). Copy to
# ~/.config/claude-gomodel.conf and edit; any model ID exposed by the Command
# Code API works (see: curl https://api.commandcode.ai/provider/v1/models).
# Leave a line commented to use its default.

# Background/cheap calls (default: xiaomi/mimo-v2.5)
#HAIKU=xiaomi/mimo-v2.5

# Default model for normal requests (default: gpt-5.6-luna)
#SONNET=gpt-5.6-luna

# Opus-tier requests (default: zai-org/GLM-5.3)
#OPUS=zai-org/GLM-5.3

# Fable-tier requests (exported as ANTHROPIC_FABLE_MODEL; no default)
#FABLE=
